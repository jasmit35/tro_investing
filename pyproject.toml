[project]
name = "tro_investing"
version = "v26.1.0.0.4"
description = "Load investing transactions into the TRO database"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "datetime>=6.0",
    "fire-starter>=26.1.0.0.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pandas-stubs>=3.0.5.260730",
    "pathlib>=1.0.1",
    "pq>=1.9.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-dateutil>=2.9.0.post0",
    "ruamel-yaml>=0.19.1",
    "schedule>=1.2.2",
]

[project.optional.dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short"

[tool.uv.sources]
fire-starter = { path = "./fire_starter" }

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "ruff>=0.16.1",
    "types-psycopg2>=2.9.21.20260724",
]
